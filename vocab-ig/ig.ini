[IG]
# CH02C VOCABULARY IG — 397 CodeSystems + 424 ValueSets + conceptdomains.
#
# Those counts move with the rulings and are not authoritative here; the
# report is. `jq .counts v291-fhir/utg-write-report.json` is what they were
# last generated from.
#
# Resources under input/resources/ are STAGED, not authored. Run
#   python3 tooling/scripts/stage_vocab_ig.py
# from the repo root before building; it copies the generated corpus out of
# v291-fhir/ into the leaf directories this IG's path-resource entries name.
#
# Build (from the repo root, not from here):
#   python3 tooling/scripts/build_vocab_ig.py --publish
#
# That script is the build, and it owns the JVM flags -- do not invoke the
# publisher by hand from this comment. Both flags it passes are load-bearing
# and were each paid for with a failed multi-hour run: -Xss16m survives the
# publisher's own malformed comparison pages, and -Xmx12g survives building
# qa.html. The reasoning for both is written out in build_vocab_ig.py; this
# file is not the place to duplicate it, or to let it drift.
#
# The template is the stock base template. This IG deliberately does NOT use
# the v2+ #local-template — that template carries v2+ structural navigation
# (segment/message tabs) that has no meaning here.
ig = input/vocabulary.xml
template = fhir.base.template#current
